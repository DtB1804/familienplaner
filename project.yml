# XcodeGen-Spezifikation.
# Erzeugt Familienplaner.xcodeproj aus diesem Verzeichnis:
#   brew install xcodegen
#   xcodegen generate
#
# Die .xcodeproj-Datei wird bewusst NICHT eingecheckt: sie ist generiert,
# erzeugt bei jedem Umbenennen riesige Diffs und ist die häufigste Ursache
# für Merge-Konflikte in Xcode-Projekten.

name: Familienplaner

options:
  bundleIdPrefix: de.barg
  deploymentTarget:
    iOS: "26.0"          # Foundation Models (On-Device-KI) setzt iOS 26 voraus
    watchOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"              # bewusst Swift-5-Sprachmodus: Core Data und
                                      # strikte Swift-6-Concurrency vertragen sich
                                      # in einem Erstaufbau schlecht
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "KF96Z9PD9Q"   # Team-ID David Barg, Apple Developer Program
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Familienplaner:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Shared            # mit der Watch-App geteilte Typen
      - path: Assets            # Asset-Katalog mit App-Icon (Pflicht für TestFlight)
      - path: Resources
        buildPhase: none
    scheme:                     # geteiltes Schema, nötig für xcodebuild archive und test
      testTargets:
        - FamilienplanerTests
        - FamilienplanerUITests
      gatherCoverageData: true
    dependencies:
      - target: FamilienplanerWatch   # Watch-App wird in die iPhone-App eingebettet
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.barg.familienplaner
        PRODUCT_NAME: Familienplaner
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Resources/Familienplaner.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"  # iPhone und iPad (seit 25.09.2026)
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Kein `info:`-Block: XcodeGen würde damit Resources/Info.plist neu erzeugen.
    # Die Datei wird von Hand gepflegt (BGTaskScheduler u. a.), INFOPLIST_FILE reicht.

  # Apple-Watch-App (eigenständige Watch-App mit iPhone-Begleitapp, seit 25.09.2026).
  # Keine eigene Datenhaltung: Das iPhone schickt einen Ausschnitt per WatchConnectivity.
  FamilienplanerWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
        excludes:
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.barg.familienplaner.watchkitapp
        PRODUCT_NAME: FamilienplanerWatch
        INFOPLIST_FILE: Watch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES

  # Automatisierte Tests (seit 25.09.2026), laufen im Workflow "Tests" auf dem Simulator.
  FamilienplanerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/FamilienplanerTests
    dependencies:
      - target: Familienplaner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.barg.familienplaner.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Familienplaner.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Familienplaner"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TARGETED_DEVICE_FAMILY: "1,2"

  FamilienplanerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/FamilienplanerUITests
    dependencies:
      - target: Familienplaner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.barg.familienplaner.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Familienplaner
        TARGETED_DEVICE_FAMILY: "1,2"
