# Simulator-Build ohne Signierung auf einem GitHub-macOS-Runner.
# Ersetzt den lokalen Mac: Fehlerprotokoll steht im Log und als Artefakt build.log.
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # für den Log-Branch ci-log

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode-Version
        run: xcodebuild -version

      - name: XcodeGen installieren
        run: brew install xcodegen

      - name: Projekt erzeugen
        run: xcodegen generate

      # build-for-testing: übersetzt App und Testziele, führt aber keine Tests aus
      # (Tests laufen nur nachts, Workflow "Tests").
      - name: Build (Simulator, ohne Signierung)
        run: |
          set -o pipefail
          xcodebuild \
            -project Familienplaner.xcodeproj \
            -scheme Familienplaner \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build-for-testing 2>&1 | tee build.log

      - name: Fehler zusammenfassen
        if: always()
        run: grep -E "error:|warning:" build.log | sort -u > errors.txt || true

      - name: Log hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            errors.txt

      # Claude kann die Actions-API aus seiner Umgebung nicht lesen, aber per Git
      # abholen. Deshalb landet das Ergebnis jedes Builds im Branch ci-log.
      - name: Log in Branch ci-log ablegen
        if: always()
        run: |
          mkdir -p /tmp/cilog && cp build.log errors.txt /tmp/cilog/ 2>/dev/null || true
          echo "commit=${GITHUB_SHA} status=${{ job.status }} run=${GITHUB_RUN_ID}" > /tmp/cilog/STATUS
          cd /tmp/cilog
          git init -q -b ci-log
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -q -m "Build-Log ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-log
